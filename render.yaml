services:
  - type: web
    name: gardenmind-backend
    env: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PROJECT_NAME
        value: GardenMind AI Backend
      - key: DATABASE_URL
        value: sqlite:////var/data/gardenmind.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: BACKEND_CORS_ORIGINS
        value: '["https://gardenmind.vercel.app","http://localhost:5173"]'
      - key: AI_PROVIDER_TYPE
        value: onnx
    disk:
      name: gardenmind-data
      mountPath: /var/data
      sizeGB: 1
